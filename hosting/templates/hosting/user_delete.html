<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>删除用户 - web项目托管平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 通知消息样式 */
        .alert {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            max-width: 600px;
            padding: 10px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">web项目托管平台</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="nav-link">欢迎, {{ user.username }}</span>
                    <a class="nav-link" href="{% url 'upload_website' %}">上传网站</a>
                    <a class="nav-link" href="{% url 'user_management' %}">用户管理</a>
                    <a class="nav-link" href="{% url 'logout' %}">退出</a>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">登录</a>
                    <a class="nav-link" href="{% url 'register' %}">注册</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">删除用户</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <div class="card">
            <div class="card-body">
                <p class="text-danger">确定要删除用户 <strong>{{ user.username }}</strong> 吗？此操作不可撤销。</p>
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">确定删除</button>
                    <a href="{% url 'user_management' %}" class="btn btn-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 自动隐藏通知消息
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                setTimeout(() => {
                    alert.style.opacity = '0';
                    alert.style.transform = 'translateX(-50%) translateY(-20px)';
                    alert.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    setTimeout(() => {
                        alert.remove();
                    }, 500);
                }, 3000); // 3秒后开始隐藏
            });
        });
    </script>

    <!-- 版本信息 -->
    <div class="fixed-bottom bg-white border-top py-2">
        <div class="container text-center">
            <p class="mb-0 text-dark">web项目托管平台 v1.8.0</p>
            <p class="text-muted small">© 2026 网站托管平台</p>
        </div>
    </div>
</body>
</html>
