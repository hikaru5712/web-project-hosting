<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑用户 - web项目托管平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 通知消息样式 */
        .alert {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            max-width: 600px;
            padding: 10px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">web项目托管平台</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="nav-link">欢迎, {{ user.username }}</span>
                    <a class="nav-link" href="{% url 'upload_website' %}">上传网站</a>
                    <a class="nav-link" href="{% url 'user_management' %}">用户管理</a>
                    <a class="nav-link" href="{% url 'logout' %}">退出</a>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">登录</a>
                    <a class="nav-link" href="{% url 'register' %}">注册</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">编辑用户</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <div class="card">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">权限级别</label>
                        <select class="form-control" id="permission_level" name="permission_level" required {% if user.username == 'guest' %}disabled{% endif %}>
                            <option value="guest" {% if user_profile.permission_level == 'guest' %}selected{% endif %}>游客</option>
                            <option value="user" {% if user_profile.permission_level == 'user' %}selected{% endif %}>普通用户</option>
                            <option value="admin" {% if user_profile.permission_level == 'admin' %}selected{% endif %}>管理员</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">具体权限</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="perm_upload" name="perm_upload" {% if user_profile.can_upload %}checked{% endif %} {% if user_profile.permission_level == 'guest' %}disabled{% endif %}>
                            <label class="form-check-label" for="perm_upload">上传网站</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="perm_edit" name="perm_edit" {% if user_profile.can_edit %}checked{% endif %} {% if user_profile.permission_level == 'guest' %}disabled{% endif %}>
                            <label class="form-check-label" for="perm_edit">编辑网站信息</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="perm_access" name="perm_access" {% if user_profile.can_access %}checked{% endif %}>
                            <label class="form-check-label" for="perm_access">访问网站</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="perm_delete" name="perm_delete" {% if user_profile.can_delete %}checked{% endif %} {% if user_profile.permission_level == 'guest' %}disabled{% endif %}>
                            <label class="form-check-label" for="perm_delete">删除网站</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="{% url 'user_management' %}" class="btn btn-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 当权限级别改变时，自动更新具体权限
        document.getElementById('permission_level').addEventListener('change', function() {
            const permissionLevel = this.value;
            const checkboxes = document.querySelectorAll('.form-check-input');
            
            if (permissionLevel === 'admin') {
                // 管理员权限默认勾选全部具体权限
                checkboxes.forEach(checkbox => {
                    checkbox.checked = true;
                    checkbox.disabled = false;
                });
            } else if (permissionLevel === 'user') {
                // 普通用户权限默认勾选全部具体权限
                checkboxes.forEach(checkbox => {
                    checkbox.checked = true;
                    checkbox.disabled = false;
                });
            } else if (permissionLevel === 'guest') {
                // 游客权限禁用所有复选框，只保留访问权限
                checkboxes.forEach(checkbox => {
                    if (checkbox.id === 'perm_access') {
                        checkbox.checked = true;
                        checkbox.disabled = false;
                    } else {
                        checkbox.checked = false;
                        checkbox.disabled = true;
                    }
                });
            }
        });
    </script>
    <script>
        // 自动隐藏通知消息
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                setTimeout(() => {
                    alert.style.opacity = '0';
                    alert.style.transform = 'translateX(-50%) translateY(-20px)';
                    alert.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    setTimeout(() => {
                        alert.remove();
                    }, 500);
                }, 3000); // 3秒后开始隐藏
            });
        });
    </script>

    <!-- 版本信息 -->
    <div class="fixed-bottom bg-white border-top py-2">
        <div class="container text-center">
            <p class="mb-0 text-dark">web项目托管平台 v1.8.0</p>
            <p class="text-muted small">© 2026 网站托管平台</p>
        </div>
    </div>
</body>
</html>
