<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认删除 - web项目托管平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">web项目托管平台</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">首页</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        确认删除
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">您确定要删除网站 "{{ website.name }}" 吗？</h5>
                        <p class="card-text text-danger">此操作不可撤销，网站文件和数据将被永久删除！</p>
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="delete_original" name="delete_original">
                                <label class="form-check-label" for="delete_original">
                                    是否删除原始项目包
                                </label>
                            </div>
                            <button type="submit" class="btn btn-danger">确认删除</button>
                            <a href="{% url 'website_detail' website.slug %}" class="btn btn-secondary">取消</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
