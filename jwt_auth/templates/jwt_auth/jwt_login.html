<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - web项目托管平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">web项目托管平台</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="{% url 'login' %}">登录</a>
                <a class="nav-link" href="{% url 'register' %}">注册</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">用户登录</h3>
                    </div>
                    <div class="card-body">
                        <div id="message" class="alert d-none"></div>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" name="username" required autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" name="password" required autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">登录</button>
                        </form>
                        <div class="mt-3 text-center">
                            <p>没有账号？<a href="{% url 'register' %}">点击注册</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            
            message.className = 'alert d-none';
            
            fetch('/api/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    message.className = 'alert alert-danger';
                    message.textContent = data.error;
                    message.classList.remove('d-none');
                } else {
                    // 存储token到localStorage
                    const users = JSON.parse(localStorage.getItem('users') || '[]');
                    const existingUserIndex = users.findIndex(user => user.username === data.username);
                    
                    if (existingUserIndex >= 0) {
                        // 更新现有用户的token
                        users[existingUserIndex] = {
                            id: data.user_id,
                            username: data.username,
                            access: data.access,
                            refresh: data.refresh,
                            permission_level: data.permission_level
                        };
                    } else {
                        // 添加新用户
                        users.push({
                            id: data.user_id,
                            username: data.username,
                            access: data.access,
                            refresh: data.refresh,
                            permission_level: data.permission_level
                        });
                    }
                    
                    localStorage.setItem('users', JSON.stringify(users));
                    localStorage.setItem('currentUser', data.username);
                    
                    // 跳转到首页
                    window.location.href = '/';
                }
            })
            .catch(error => {
                message.className = 'alert alert-danger';
                message.textContent = '登录失败，请重试';
                message.classList.remove('d-none');
                console.error('Error:', error);
            });
        });
    </script>

    <!-- 版本信息 -->
    <div class="fixed-bottom bg-white border-top py-2">
        <div class="container text-center">
            <p class="mb-0 text-dark">web项目托管平台 v1.8.0</p>
            <p class="text-muted small">© 2026 web项目托管平台</p>
        </div>
    </div>
</body>
</html>
